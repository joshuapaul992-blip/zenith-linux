# boot/grub/grub.cfg -- GRUB 2 configuration for the Kestrel ISO (BIOS + UEFI)
#
# GRUB is only the loader here (the kernel draws its own boot manager); its
# menu offers the desktop (default) or the text console for 5 seconds. all_video loads VBE (BIOS) and GOP/UGA
# (UEFI) drivers so GRUB can honour the kernel's Multiboot2 request for a
# 1024x768x32 linear frame buffer.

# A kestrel.exec= baked in with KERNEL_CMDLINE comes first and wins over startx.
set timeout=5
set default=0

insmod all_video
insmod multiboot2

# The boot volume (programs, X11, IceWM, xterm, BusyBox) travels as a
# Multiboot2 module; the kernel turns it into /dev/ram0 and mounts it on
# /boot like the USB stick's volume.
menuentry "Kestrel x86_64 - desktop (X11, IceWM, xterm)" {
    multiboot2 /boot/kernel.elf @KERNEL_CMDLINE@ kestrel.exec=/bin/startx
    module2 /boot/kestrel.vol kestrel-volume
    boot
}

menuentry "Kestrel x86_64 - text console" {
    multiboot2 /boot/kernel.elf @KERNEL_CMDLINE@
    module2 /boot/kestrel.vol kestrel-volume
    boot
}
