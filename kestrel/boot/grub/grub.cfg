# boot/grub/grub.cfg -- GRUB 2 configuration for the Kestrel ISO (BIOS + UEFI)
#
# GRUB is only the loader here: the kernel draws its own boot manager, so
# GRUB's menu is skipped (timeout=0). all_video loads VBE (BIOS) and GOP/UGA
# (UEFI) drivers so GRUB can honour the kernel's Multiboot2 request for a
# 1024x768x32 linear frame buffer.

set timeout=0
set default=0

insmod all_video
insmod multiboot2

menuentry "Kestrel x86_64" {
    multiboot2 /boot/kernel.elf @KERNEL_CMDLINE@
    boot
}
