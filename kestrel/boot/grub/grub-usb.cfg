# boot/grub/grub-usb.cfg -- configuration embedded (with the kernel) in the
# memdisk of the USB stick's core.img. The kernel then finds the stick again
# on its own (xHCI + mass storage) and mounts its Kestrel volume on /boot.

# Two entries: the desktop (X server, IceWM, xterm via /boot/bin/startx; the
# text terminals stay underneath) and the text console only.
# A kestrel.exec= baked in with KERNEL_CMDLINE comes first and wins over startx.
set timeout=5
set default=0

# The same memdisk is used by the BIOS core.img and by EFI/BOOT/BOOTX64.EFI.
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
fi
insmod multiboot2

menuentry "Kestrel x86_64 - desktop (X11, IceWM, xterm)" {
    multiboot2 (memdisk)/boot/kernel.elf kestrel.root=usb @KERNEL_CMDLINE@ kestrel.exec=/bin/startx
    boot
}

menuentry "Kestrel x86_64 - text console" {
    multiboot2 (memdisk)/boot/kernel.elf kestrel.root=usb @KERNEL_CMDLINE@
    boot
}
