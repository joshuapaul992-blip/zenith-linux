# boot/grub/grub-usb.cfg -- configuration embedded (with the kernel) in the
# memdisk of the USB stick's core.img. The kernel then finds the stick again
# on its own (xHCI + mass storage) and mounts its Kestrel volume on /boot.

set timeout=0
set default=0

insmod vbe
insmod multiboot2

menuentry "Kestrel x86_64 (USB boot volume)" {
    multiboot2 (memdisk)/boot/kernel.elf kestrel.root=usb @KERNEL_CMDLINE@
    boot
}
