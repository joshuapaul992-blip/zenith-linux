# boot/grub/grub-floppy.cfg -- configuration embedded (with the kernel) in
# the memdisk of the 1.44 MB floppy image. BIOS only, VBE graphics.

set timeout=0
set default=0

insmod vbe
insmod multiboot2

menuentry "Kestrel x86_64 (floppy)" {
    multiboot2 (memdisk)/boot/kernel.elf @KERNEL_CMDLINE@
    boot
}
