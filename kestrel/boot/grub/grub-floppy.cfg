# boot/grub/grub-floppy.cfg -- configuration embedded in the memdisk of the
# 1.44 MB floppy image. BIOS only, VBE graphics. The kernel follows core.img
# on the disk as raw sectors (@KERNEL_BLOCKS@: first sector + count), read by
# block list from the floppy; the second entry, tried if that fails, reads
# them from the first hard disk, for a BIOS that presents the image as one
# (USB floppy emulation).

set timeout=0
set default=0
set fallback=1

insmod vbe
insmod multiboot2

menuentry "Kestrel x86_64 (floppy)" {
    multiboot2 (fd0)@KERNEL_BLOCKS@ @KERNEL_CMDLINE@
    boot
}

menuentry "Kestrel x86_64 (floppy image on a hard disk)" {
    multiboot2 (hd0)@KERNEL_BLOCKS@ @KERNEL_CMDLINE@
    boot
}
