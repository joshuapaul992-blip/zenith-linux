# AuraOS GRUB configuration
set timeout=0
set default=0

menuentry "AuraOS" {
    multiboot2 /boot/auraos.kernel
    # The kernel's Multiboot2 header carries a framebuffer tag. Parsing it,
    # the multiboot2 command overwrites gfxpayload with the tag's preferred
    # mode plus ",auto", which on BIOS lands in a VBE *graphics* mode and makes
    # the VGA text buffer at 0xB8000 invisible. Force text mode here; this must
    # come AFTER the multiboot2 line or it is overwritten.
    set gfxpayload=text
    boot
}
