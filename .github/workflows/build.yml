name: Build Zenith Linux ISO

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            cpio xz-utils gzip squashfs-tools wget curl ca-certificates \
            xorriso isolinux syslinux-common

      - name: Build core ISO
        run: ./build.sh all

      - name: Report core artifact sizes
        run: |
          ls -lh build/vmlinuz build/initramfs.cpio.gz output/zenith_linux.iso

      - name: Upload core ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-linux-iso
          path: output/zenith_linux.iso
          if-no-files-found: error

      - name: Attach core ISO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/zenith_linux.iso

  build-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            cpio xz-utils gzip squashfs-tools cloop-utils \
            wget curl ca-certificates xorriso isolinux syslinux-common

      - name: Build GUI ISO
        run: sudo -E ./build-gui.sh all

      - name: Report GUI artifact sizes
        run: |
          ls -lh build/gui/vmlinuz build/gui/rootfs.squashfs \
                 build/gui/initramfs.cpio.gz output/zenith-gui.iso

      - name: Upload GUI ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-gui-iso
          path: output/zenith-gui.iso
          if-no-files-found: error

      - name: Attach GUI ISO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/zenith-gui.iso
