UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT zenith

MENU TITLE Zenith Linux

LABEL zenith
  MENU LABEL Zenith Linux (framebuffer console)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz quiet

LABEL serial
  MENU LABEL Zenith Linux (serial console ttyS0)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz console=ttyS0,115200 console=tty0
