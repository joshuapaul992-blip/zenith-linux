UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT zenith-gui

MENU TITLE Zenith Linux (GUI)

LABEL zenith-gui
  MENU LABEL Zenith Linux - DSL-style desktop
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz console=tty0 quiet

LABEL zenith-gui-serial
  MENU LABEL Zenith Linux - desktop + serial debug (ttyS0)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz console=tty0 console=ttyS0,115200
