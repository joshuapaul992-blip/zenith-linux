UI menu.c32
PROMPT 0
TIMEOUT 80
DEFAULT zenith-gui

MENU TITLE Zenith Linux (GUI)

# A VESA framebuffer (vga=) is requested so simpledrm/fbdev has a screen on
# real hardware and VirtualBox, which have no KMS driver in this kernel. This
# is the modern equivalent of DSL's Xvesa boot.

LABEL zenith-gui
  MENU LABEL Zenith Linux - DSL-style desktop (1024x768)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz vga=791 console=tty0 quiet

LABEL zenith-gui-safe
  MENU LABEL Zenith Linux - safe graphics (800x600)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz vga=788 console=tty0

LABEL zenith-gui-ask
  MENU LABEL Zenith Linux - pick a screen mode
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz vga=ask console=tty0

LABEL zenith-gui-serial
  MENU LABEL Zenith Linux - desktop + serial debug (ttyS0)
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/initramfs.gz vga=791 console=tty0 console=ttyS0,115200
